name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check public payment profile
        env:
          VITE_PAYPAL_ME_USERNAME: ${{ vars.PAYPAL_ME_USERNAME }}
        run: |
          test -n "$VITE_PAYPAL_ME_USERNAME"
          test "$VITE_PAYPAL_ME_USERNAME" != "your-paypal-me-username"
      - run: npm run build
        env:
          VITE_PAYPAL_ME_USERNAME: ${{ vars.PAYPAL_ME_USERNAME }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
