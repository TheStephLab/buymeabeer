name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Quality checks"]
    types: [completed]

# Deploys the production site to the gh-pages branch (branch-based Pages).
# Branch-based deployment is required so that rossjrw/pr-preview-action can
# publish per-PR previews into the same branch under pr-preview/.
permissions:
  contents: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Build production site
        env:
          VITE_PAYPAL_ME_USERNAME: ${{ vars.PAYPAL_ME_USERNAME }}
        run: npm run build:production
      - name: Preserve custom domain
        run: echo "buymeabeer.co.uk" > dist/CNAME
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # Never delete live PR previews when publishing production.
          clean-exclude: pr-preview/
