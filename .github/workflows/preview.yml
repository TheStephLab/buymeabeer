name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

# Deploys a preview of each pull request to the gh-pages branch under
# pr-preview/pr-<number>/ and comments the URL on the PR. Previews are removed
# automatically when the PR is closed.
permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install and build preview
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}/
          VITE_PAYPAL_ME_USERNAME: ${{ vars.PAYPAL_ME_USERNAME }}
        run: |
          npm ci
          npm run build

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          wait-for-pages-deployment: true
